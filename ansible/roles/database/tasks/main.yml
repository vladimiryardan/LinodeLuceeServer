---
- name: Install MariaDB packages
  ansible.builtin.apt:
    name: "{{ mariadb_packages }}"
    state: present
    update_cache: true

- name: Ensure MariaDB is enabled and running
  ansible.builtin.service:
    name: "{{ mariadb_service_name }}"
    state: started
    enabled: true

- name: Configure MariaDB bind address
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address\s*='
    line: "bind-address = {{ mariadb_bind_address }}"
  notify: Restart MariaDB

- name: Configure MariaDB port
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^port\s*='
    line: "port = {{ mariadb_port }}"
  notify: Restart MariaDB

- name: Create application databases
  ansible.mysql.mysql_db:
    name: "{{ item.database.name }}"
    state: present
    encoding: "{{ item.database.character_set | default(mariadb_character_set) }}"
    collation: "{{ item.database.collation | default(mariadb_collation) }}"
    login_unix_socket: /run/mysqld/mysqld.sock
  loop: "{{ websites }}"
  when: item.database.enabled | default(false) | bool

- name: Create application database users
  ansible.mysql.mysql_user:
    name: "{{ item.database.user }}"
    password: "{{ database_passwords[item.name] }}"
    host: "127.0.0.1"
    priv: "{{ item.database.name }}.*:ALL"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  loop: "{{ websites }}"
  when: item.database.enabled | default(false) | bool
  no_log: true
