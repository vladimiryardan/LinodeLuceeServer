---
# RustDesk Server OSS configuration

rustdesk_install_dir: /opt/rustdesk

# Pin this to a tested release before production deployment.
rustdesk_image: "rustdesk/rustdesk-server@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00"

# RustDesk services
rustdesk_id_service: hbbs
rustdesk_relay_service: hbbr

# Use host networking for the RustDesk server.
rustdesk_network_mode: host

# Server address used by RustDesk clients.
rustdesk_server_address: "{{ ansible_host }}"
