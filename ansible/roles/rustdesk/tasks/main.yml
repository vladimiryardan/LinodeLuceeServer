---
- name: Create RustDesk directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - "{{ rustdesk_install_dir }}"
    - "{{ rustdesk_install_dir }}/data"

- name: Deploy RustDesk Docker Compose configuration
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ rustdesk_install_dir }}/compose.yml"
    owner: root
    group: root
    mode: '0600'

- name: Configure RustDesk firewall
  ansible.builtin.import_tasks: firewall.yml

- name: Start RustDesk services
  community.docker.docker_compose_v2:
    project_src: "{{ rustdesk_install_dir }}"
    files:
      - compose.yml
    state: present
    pull: missing
  when: not ansible_check_mode
