---
- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: "{{ security_ufw_default_incoming_policy }}"

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: "{{ security_ufw_default_outgoing_policy }}"

- name: Allow required TCP ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ security_ufw_allowed_tcp_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Configure Fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2ban

- name: Ensure Fail2ban is enabled and running
  ansible.builtin.service:
    name: "{{ security_fail2ban_service }}"
    state: started
    enabled: true
