---
- name: Create CommandBox home
  ansible.builtin.file:
    path: "{{ commandbox_home }}"
    state: directory
    owner: "{{ commandbox_server_user }}"
    group: "{{ commandbox_server_group }}"
    mode: "0755"

- name: Create website webroots
  ansible.builtin.file:
    path: "{{ item.webroot }}"
    state: directory
    owner: "{{ commandbox_server_user }}"
    group: "{{ commandbox_server_group }}"
    mode: "0755"
  loop: "{{ websites }}"

- name: Configure Ortus CommandBox repository
  ansible.builtin.deb822_repository:
    name: commandbox
    types:
      - deb
    uris:
      - "{{ commandbox_apt_repository_uri }}"
    suites:
      - "/"
    signed_by: "{{ commandbox_apt_key_url }}"
    state: present
    enabled: true

- name: Install CommandBox
  ansible.builtin.apt:
    name: "{{ commandbox_package }}"
    state: present
    update_cache: true

- name: Render CommandBox server configuration
  ansible.builtin.template:
    src: server.json.j2
    dest: "{{ item.webroot }}/server.json"
    owner: "{{ commandbox_server_user }}"
    group: "{{ commandbox_server_group }}"
    mode: "0644"
  loop: "{{ websites }}"
  register: commandbox_server_configs

- name: Create systemd service for each Lucee instance
  ansible.builtin.template:
    src: commandbox.service.j2
    dest: "/etc/systemd/system/commandbox-{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ websites }}"
  register: commandbox_systemd_units
  notify: Reload systemd

- name: Enable and start CommandBox servers
  ansible.builtin.systemd:
    name: "commandbox-{{ item.name }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ websites }}"

- name: Restart CommandBox server when systemd unit changed
  ansible.builtin.systemd:
    name: "commandbox-{{ item.item.name }}.service"
    state: restarted
    daemon_reload: true
  loop: "{{ commandbox_systemd_units.results }}"
  when: item.changed

- name: Restart CommandBox server when configuration changed
  ansible.builtin.systemd:
    name: "commandbox-{{ item.item.name }}.service"
    state: restarted
  loop: "{{ commandbox_server_configs.results }}"
  when: item.changed
